<meta name="robots" content="noindex,nofollow">

<style>
:root{
  --bg:#eef2f9; --panel:#ffffff; --panel2:#f3f6fb; --line:rgba(15,23,42,.09); --text:#0f172a; --muted:#64748b;
  --brand:#4f46e5; --brand2:#7c3aed; --brandSoft:rgba(79,70,229,.12); --good:#059669; --goodSoft:rgba(5,150,105,.13);
  --bad:#e11d48; --badSoft:rgba(225,29,72,.12); --warn:#b45309; --warnSoft:rgba(217,119,6,.16);
  --shadow:0 1px 3px rgba(15,23,42,.05),0 10px 28px -14px rgba(15,23,42,.22); --glow:0 16px 36px -14px rgba(79,70,229,.6);
  --tabH:62px;
}
:root[data-theme="dark"]{
  --bg:#070b16; --panel:#111a2e; --panel2:#0c1426; --line:rgba(148,163,184,.14); --text:#e6ebf5; --muted:#8b98b1;
  --brand:#818cf8; --brand2:#a855f7; --brandSoft:rgba(129,140,248,.2); --good:#34d399; --goodSoft:rgba(52,211,153,.15);
  --bad:#fb7185; --badSoft:rgba(251,113,133,.17); --warn:#fbbf24; --warnSoft:rgba(251,191,36,.17);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 14px 32px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Nirmala UI",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brandSoft)}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(var(--tabH) + 26px + env(safe-area-inset-bottom));min-height:100vh}
.muted{color:var(--muted)} .small{font-size:12.5px} .num{font-variant-numeric:tabular-nums}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 2px 12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand img{width:42px;height:42px;border-radius:13px;box-shadow:var(--glow)}
.brand b{display:block;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12px}
.hbtns{display:flex;gap:8px;flex-shrink:0}
.hbtns button{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:16px;box-shadow:var(--shadow)}
.hbtns button.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{border-radius:12px;padding:10px 13px;font-size:13px;font-weight:600;margin-bottom:12px}
.banner.warn{background:var(--warnSoft);color:var(--warn)}
.banner.info{background:var(--brandSoft);color:var(--brand);display:flex;align-items:center;gap:10px}
.banner.info span{flex:1}
.banner.info button{font-weight:800;padding:6px 10px;border-radius:9px;background:var(--brand);color:#fff;font-size:12.5px}
.banner.info button.x{background:none;color:inherit;padding:6px}
/* cards */
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;animation:in .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 button{font-size:12.5px;font-weight:700;color:var(--brand)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(125deg,#4f46e5,#7c3aed 50%,#db2777);box-shadow:var(--glow)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(340px 180px at 95% 0%,rgba(255,255,255,.3),transparent 60%)}
.hero::after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;border:30px solid rgba(255,255,255,.09);right:-70px;bottom:-110px}
.hero>*{position:relative}
.hero .who{font-size:13.5px;opacity:.92}
.hero .who b{font-size:17px;display:block;margin-top:1px}
.hero .lbl{margin-top:14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.85}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hero .sub{font-size:13.5px;opacity:.95;margin-top:2px}
.hero .acts{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.hero .acts button{padding:11px 16px;border-radius:13px;font-weight:800;font-size:14.5px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.4);color:#fff}
.hero .acts button.main{background:#fff;color:#4f46e5;border-color:#fff}
/* month grid */
.yg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{border-radius:13px;padding:9px 6px;text-align:center;background:var(--panel2);border:1px solid transparent}
.mc small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.mc b{display:block;font-size:14px;margin-top:1px}
.mc.paid{background:var(--goodSoft)} .mc.paid b,.mc.adj b{color:var(--good)}
.mc.adj{background:var(--goodSoft);opacity:.85}
.mc.partial{background:var(--warnSoft)} .mc.partial b{color:var(--warn)}
.mc.due{background:var(--badSoft)} .mc.due b{color:var(--bad)}
.mc.future b{color:var(--muted);font-weight:500}
.mc.now{border-color:var(--brand)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;vertical-align:-1px;margin-right:4px}
/* key figures */
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kp .k{background:var(--panel2);border-radius:14px;padding:12px;overflow-wrap:anywhere}
.kp .k span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.kp .k b{font-size:19px;letter-spacing:-.01em}
.kp .k.good b{color:var(--good)} .kp .k.bad b{color:var(--bad)}
.prog{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.line{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 0}
.line b{white-space:nowrap}
/* pills */
.pills{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:8px 14px;border-radius:12px;font-weight:700;font-size:13.5px;background:var(--panel2);border:1px solid var(--line)}
.pill.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}
/* bar chart */
.chartWrap{overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.chartWrap::-webkit-scrollbar{display:none}
.chart{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(31px,1fr);gap:2px;align-items:end;height:156px;padding:6px 4px 0}
.cm{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;border-radius:9px;padding:3px 0;min-width:0}
.cm.active{background:var(--brandSoft)}
.cm .bars{display:flex;gap:2px;align-items:flex-end;flex:1;width:100%;justify-content:center}
.cm .bars i{display:block;width:9px;border-radius:4px 4px 0 0;min-height:2px}
.cm small{font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.cm.active small{color:var(--brand)}
.c-in{background:#6366f1} .c-out{background:#f59e0b}
/* lists */
.rows{display:grid}
.rw{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.rw:last-child{border-bottom:0}
.rw .em{width:38px;height:38px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:18px;flex-shrink:0;font-weight:800}
.rw .tx{flex:1;min-width:0}
.rw .tx b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .tx small{color:var(--muted);font-size:12.5px}
.rw .am{font-weight:800;white-space:nowrap;text-align:right}
.rw .am small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.rw.me{background:var(--brandSoft);border-radius:13px;padding:11px 9px;margin:2px -9px;border-bottom:0}
.rw .em.no{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:14.5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.good{background:var(--goodSoft);color:var(--good)} .chip.bad{background:var(--badSoft);color:var(--bad)}
.chip.warn{background:var(--warnSoft);color:var(--warn)} .chip.info{background:var(--brandSoft);color:var(--brand)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.cat{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13.5px;padding:6px 0}
.cat .track{grid-column:1/3;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.cat .track i{display:block;height:100%;border-radius:99px}
.ins{display:grid;gap:8px}
.ins div{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border-left:4px solid var(--brand);font-size:13.5px}
.ins div.good{border-color:var(--good)} .ins div.bad{border-color:var(--bad)} .ins div.warn{border-color:var(--warn)}
.notice{white-space:pre-wrap;overflow-wrap:anywhere}
.notice .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.notice .hd b{font-size:15.5px}
.notice .hd small{color:var(--muted);white-space:nowrap;font-size:12px}
.notice.pin{border-color:var(--brand)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15.5px;background:var(--panel2);border:1px solid var(--line)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:var(--glow)}
.btn.wa{background:#25d366;color:#fff;border-color:transparent}
.btn:active,.pill:active,.rw:active,.hero .acts button:active{transform:scale(.98)}
.help{font-size:12.5px;color:var(--muted);margin:8px 2px 16px}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);display:none}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabH)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
#tabs button i{font-style:normal;font-size:21px;line-height:1;filter:grayscale(1);opacity:.7}
#tabs button.active{color:var(--brand)}
#tabs button.active i{filter:none;opacity:1}
#tabs button .dot{position:absolute;top:9px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--panel)}
/* bottom sheet */
#ov{position:fixed;inset:0;z-index:40;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center}
#ov.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#sheet{background:var(--panel);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
#sheet .grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
#sheet h2{margin:0 0 4px;font-size:19px}
#sheet label{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-top:14px}
.opts{display:grid;gap:8px;margin:14px 0}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);font-weight:700;width:100%;text-align:left}
.opt.active{border-color:var(--brand);background:var(--brandSoft)}
.opt input{width:130px;padding:8px 10px;text-align:right}
.payto{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:14px;background:var(--panel2);margin-bottom:14px}
.payto div{flex:1;min-width:0}
.payto small{display:block;color:var(--muted);font-size:12px}
.payto b{display:block;font-size:16px;overflow-wrap:anywhere}
.payto button{padding:9px 13px;border-radius:11px;background:var(--brandSoft);color:var(--brand);font-weight:800;font-size:13px}
.steps{margin:12px 0 4px;padding-left:22px;display:grid;gap:9px}
/* lock / picker */
.center{min-height:100vh;display:grid;place-items:center;padding:24px 0}
.center .box{width:100%;text-align:center}
.center img{width:84px;height:84px;border-radius:24px;box-shadow:var(--glow)}
.center h1{font-size:22px;margin:16px 0 4px}
.center p{color:var(--muted);margin:0 0 18px}
.center .err{color:var(--bad);font-weight:700;min-height:22px;margin:10px 0}
.center input{text-align:center;font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
.pick{display:grid;gap:8px;text-align:left;margin-top:6px}
#toasts{position:fixed;left:14px;right:14px;bottom:calc(var(--tabH) + 16px + env(safe-area-inset-bottom));z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:11px 16px;border-radius:13px;font-weight:700;font-size:13.5px;box-shadow:0 16px 36px -12px rgba(0,0,0,.6);animation:in .25s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------------------------------------------------------------- state & helpers */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem("soc."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("soc."+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem("soc."+k)}catch(e){}}};
const TABS=["home","acc","mem","not","more"];
const TAB_ICON={home:"🏠",acc:"📊",mem:"👥",not:"📢",more:"☰"};
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const STANDALONE=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const NOW=new Date();
const S={lang:LS.get("lang","mr"),flat:LS.get("flat",null),pass:LS.get("pass",""),tab:"home",data:null,enc:null,
  offline:false,accMonth:null,memMonth:null,payAmt:0,installEvt:null,loadedAt:0};
const normPass=p=>String(p||"").replace(/[\s\-]/g,"").toUpperCase();
function t(k,v){let s=T[S.lang][k]??T.en[k]??k;if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s}
function n(x){const s=String(x);return S.lang==="mr"?s.replace(/\d/g,d=>"०१२३४५६७८९"[d]):s}
function grp(v){v=Math.round(Math.abs(v));let s=String(v);if(s.length>3){let h=s.slice(0,-3),g=[];const tl=s.slice(-3);while(h.length>2){g.unshift(h.slice(-2));h=h.slice(0,-2)}g.unshift(h);s=g.join(",")+","+tl}return s}
function money(v,sign){v=Math.round(v||0);return (v<0?"-":(sign&&v>0?"+":""))+"₹"+n(grp(v))}
const mon=m=>MON[S.lang][m], monF=m=>MON[S.lang+"F"][m];
function bname(){return S.data?(S.lang==="mr"?S.data.building_mr:S.data.building):t("name")}
function fmtDate(iso){if(!iso)return"";const p=iso.slice(0,10).split("-");return n(+p[2])+" "+mon(+p[1]-1)}
function fmtStamp(iso){if(!iso)return"";const tm=iso.slice(11,16).split(":"),h=+tm[0];return fmtDate(iso)+", "+n((h%12||12)+":"+tm[1])+(h<12?" AM":" PM")}
function toast(msg){const e=document.createElement("div");e.className="toast";e.textContent=msg;$("toasts").appendChild(e);setTimeout(()=>e.remove(),2600)}
function copyText(txt){const done=()=>toast(t("copied"));
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));else fallbackCopy(txt,done)}
function fallbackCopy(txt,done){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}ta.remove()}
function wa(text,phone){window.open("https://wa.me/"+(phone||"")+"?text="+encodeURIComponent(text),"_blank")}
function setTheme(th){document.documentElement.setAttribute("data-theme",th);LS.set("theme",th);
  document.querySelector('meta[name="theme-color"]').setAttribute("content",th==="dark"?"#070b16":"#4f46e5")}
setTheme(LS.get("theme",matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));

/* ---------------------------------------------------------------- data rules (same as the committee's sheet) */
function me(){return S.data.flats.find(f=>String(f.no)===String(S.flat))}
function curMonth(){return S.data.year===NOW.getFullYear()?NOW.getMonth():11}
/* paid / partial / due / future. "adj" = cell is short but the flat owes nothing overall
   (paid through another month), so it is not shown as pending. */
function status(f,m){const D=S.data,v=f.paid[m];
  if(v>=D.rate)return"paid";
  if(m>=D.months_due)return v>0?"partial":"future";
  if(f.outstanding<=0)return"adj";
  return v>0?"partial":"due"}
function pendingMonths(f){const out=[];for(let m=0;m<S.data.months_due&&m<12;m++){const s=status(f,m);if(s==="due"||s==="partial")out.push(m)}return out}
function monthCounts(m){const c={paid:0,partial:0,due:0};S.data.flats.forEach(f=>{const s=status(f,m);if(s==="paid"||s==="adj")c.paid++;else if(s==="partial")c.partial++;else c.due++});return c}

/* ---------------------------------------------------------------- unlock */
function b64(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function decrypt(enc,pass){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(normPass(pass)),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},key,b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain))}

function readLink(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("k")){S.pass=normPass(h.get("k"));LS.set("pass",S.pass)}
  if(h.get("flat")&&S.flat===null){S.flat=h.get("flat");LS.set("flat",S.flat)}
  if(TABS.includes(h.get("tab")))S.tab=h.get("tab");
  keepLink()}
/* iPhone keeps a separate storage for home-screen apps, so the key stays in the address until
   the app is added to the home screen. Everywhere else the key is removed from the address. */
function keepLink(){try{
  if(IOS&&!STANDALONE){const ml=$("manifestLink");if(ml)ml.remove();if(S.pass)history.replaceState(null,"","#k="+S.pass)}
  else if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}}

async function loadData(){
  if(!window.crypto||!crypto.subtle)return fatal("insecure");
  let enc=null;
  try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);enc=await r.json();LS.set("enc",enc);S.offline=false}
  catch(e){enc=LS.get("enc",null);S.offline=true}
  if(!enc)return fatal("fatal");
  S.enc=enc;S.loadedAt=Date.now();
  return openData()}
async function openData(){
  if(!S.pass)return lockScreen("");
  try{S.data=await decrypt(S.enc,S.pass)}
  catch(e){S.data=null;return lockScreen(LS.get("opened",false)?"changed":"wrong")}
  LS.set("opened",true);keepLink();
  if(S.accMonth===null){const cm=curMonth();let m=cm;while(m>0&&!S.data.months[m].entries.length)m--;S.accMonth=m;S.memMonth=cm}
  if(!me())return pickScreen();
  render();return true}

function fatal(kind){hideTabs();$("app").innerHTML=`<div class="center"><div class="box"><img src="icon-192.png" alt=""><h1>${esc(t("name"))}</h1><p>${t(kind)}</p>${kind==="fatal"?`<button class="btn primary" onclick="loadData()">⟳ ${t("retry")}</button>`:""}</div></div>`}
function lockScreen(err){hideTabs();
  $("app").innerHTML=`<div class="center"><form class="box" onsubmit="return tryPass(event)"><img src="icon-192.png" alt=""><h1>${esc(t("name"))}</h1><p>🔒 ${t("passTitle")}<br><span class="small">${t("passHint")}</span></p>
    <input id="passIn" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XX" aria-label="${t("passTitle")}">
    <div class="err">${err?t(err):""}</div><button class="btn primary" type="submit">${t("open")}</button>
    <p style="margin-top:18px"><button type="button" class="small muted" onclick="toggleLang(true)">${S.lang==="mr"?"English":"मराठी"}</button></p></form></div>`}
function tryPass(ev){ev.preventDefault();const v=normPass($("passIn").value);if(!v)return false;S.pass=v;LS.set("pass",v);openData();return false}
function pickScreen(){hideTabs();
  $("app").innerHTML=`<div class="center" style="place-items:start center"><div class="box"><img src="icon-192.png" alt=""><h1>${t("pickTitle")}</h1><p>${t("pickHint")}</p>
    <div class="card pick">${S.data.flats.map((f,i)=>`<button class="rw" onclick="pickFlat(${i})"><span class="em no">${n(f.no)}</span><span class="tx"><b>${esc(f.name)}</b><small>${t("flat")} ${n(f.no)}</small></span><span>›</span></button>`).join("")}</div></div></div>`;
  scrollTo(0,0)}
function pickFlat(i){S.flat=String(S.data.flats[i].no);LS.set("flat",S.flat);S.tab="home";render();scrollTo(0,0)}

/* ---------------------------------------------------------------- shell */
function hideTabs(){$("tabs").style.display="none";closeSheet()}
function unseen(){const seen=LS.get("seen",0);return S.data.notices.some(x=>x.id>seen)}
function renderTabs(){$("tabs").style.display="block";
  $("tabsIn").innerHTML=TABS.map(k=>`<button class="${S.tab===k?"active":""}" onclick="go('${k}')"><i>${TAB_ICON[k]}</i>${t(k)}${k==="not"&&unseen()?'<span class="dot"></span>':""}</button>`).join("")}
function go(tab){S.tab=tab;render();scrollTo(0,0)}
function header(){return `<header class="top"><div class="brand"><img src="icon-192.png" alt=""><div><b>${esc(bname())}</b><small>${t("updated")}: ${fmtStamp(S.data.updated)}</small></div></div>
  <div class="hbtns"><button onclick="toggleLang()" aria-label="${t("language")}">${S.lang==="mr"?"A":"अ"}</button><button id="refBtn" onclick="refresh()" aria-label="${t("refresh")}">⟳</button></div></header>
  ${S.offline?`<div class="banner warn">📡 ${t("offline")}</div>`:""}`}
function render(){if(!S.data)return;
  document.documentElement.lang=S.lang;
  if(S.tab==="not"&&S.data.notices.length)LS.set("seen",Math.max(...S.data.notices.map(x=>x.id)));
  $("app").innerHTML=header()+`<div class="stack">${({home:homeView,acc:accView,mem:memView,not:notView,more:moreView})[S.tab]()}</div>`;
  renderTabs();keepPill()}
function toggleLang(locked){S.lang=S.lang==="mr"?"en":"mr";LS.set("lang",S.lang);if(locked)lockScreen("");else render()}
function toggleTheme(){setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");render()}
async function refresh(){const b=$("refBtn");if(b)b.classList.add("spin");await loadData();toast(S.offline?t("noNet"):t("refreshed"))}
function lockApp(){S.pass="";S.data=null;LS.del("pass");try{history.replaceState(null,"",location.pathname)}catch(e){}lockScreen("")}

/* ---------------------------------------------------------------- shared pieces */
function yearGrid(f){const cm=curMonth();
  return `<div class="yg">${f.paid.map((v,m)=>{const s=status(f,m);
    return `<div class="mc ${s}${m===cm?" now":""}"><small>${mon(m)}</small><b class="num">${v>0?money(v):s==="due"?t("due"):s==="adj"?"✓":"—"}</b></div>`}).join("")}</div>
  <div class="legend"><span><i style="background:var(--good)"></i>${t("paid")}</span><span><i style="background:var(--warn)"></i>${t("partial")}</span><span><i style="background:var(--bad)"></i>${t("due")}</span></div>`}
function noticeCard(x){return `<div class="card notice${x.pinned?" pin":""}"><div class="hd"><b>${x.pinned?"📌 ":""}${esc(x.title)}</b><small>${fmtDate(x.date)}</small></div>${x.body?`<div>${esc(x.body)}</div>`:""}</div>`}
/* last month worth showing: the current one, or later if the sheet already has figures there */
function lastMonth(){const D=S.data;let last=Math.min(11,Math.max(curMonth(),D.months_due-1));
  D.months.forEach((m,i)=>{if(m.collected||m.expenses)last=Math.max(last,i)});return last}
function monthPills(sel,fn){const last=lastMonth();
  return `<div class="pills" id="pills">${S.data.months.map((_,m)=>m<=last?`<button class="pill${m===sel?" active":""}" onclick="${fn}(${m})">${mon(m)}</button>`:"").join("")}</div>`}
/* keep the chosen month in view inside its own strip, without moving the page */
function keepPill(){document.querySelectorAll("#pills .active,.chart .active").forEach(p=>{const box=p.parentNode.classList.contains("chart")?p.parentNode.parentNode:p.parentNode;
  box.scrollLeft=p.offsetLeft-box.offsetLeft-(box.clientWidth-p.offsetWidth)/2})}

/* ---------------------------------------------------------------- home */
function homeView(){const D=S.data,f=me(),cm=curMonth(),mo=D.months[cm],c=monthCounts(cm),pend=pendingMonths(f);
  let st;
  if(f.outstanding>0)st=`<div class="lbl">${t("outstanding")}</div><div class="big num">${money(f.outstanding)}</div>${pend.length?`<div class="sub">${t("pendingMonths")}: ${pend.map(mon).join(", ")}</div>`:""}`;
  else if(f.outstanding<0)st=`<div class="lbl">${t("advance")}</div><div class="big num">${money(-f.outstanding)}</div><div class="sub">✅ ${t("allPaid")}</div>`;
  else st=`<div class="lbl">${t("outstanding")}</div><div class="big num">${money(0)}</div><div class="sub">✅ ${t("allPaid")}</div>`;
  const showInstall=!STANDALONE&&!LS.get("noInstall",false);
  const top=D.notices[0];
  return `${showInstall?`<div class="banner info"><span>📲 ${t("instBanner")}</span><button onclick="installSheet()">${t("instNow")}</button><button class="x" onclick="LS.set('noInstall',true);render()" aria-label="close">✕</button></div>`:""}
  <div class="hero"><div class="who">${t("hello")} 🙏<b>${esc(f.name)} · ${t("flat")} ${n(f.no)}</b></div>${st}
    <div class="acts">${f.outstanding>0?`<button class="main" onclick="paySheet()">💳 ${t("payNow")}</button>`:""}<button onclick="flatSheet(${D.flats.indexOf(f)})">📋 ${t("details")}</button></div></div>
  ${top?`<div class="card notice${top.pinned?" pin":""}"><h3>📢 ${t("latest")}<button onclick="go('not')">${t("all")} ›</button></h3><div class="hd"><b>${top.pinned?"📌 ":""}${esc(top.title)}</b><small>${fmtDate(top.date)}</small></div>${top.body?`<div>${esc(top.body)}</div>`:""}</div>`:""}
  <div class="card"><h3>📅 ${t("myYear",{y:n(D.year)})}</h3>${yearGrid(f)}</div>
  <div class="card"><h3>🏦 ${t("society")}<button onclick="go('acc')">${t("details")} ›</button></h3>
    <div class="kp"><div class="k"><span>${t("bank")}</span><b class="num">${money(D.balance)}</b></div><div class="k bad"><span>${t("totalDue")}</span><b class="num">${money(D.totals.outstanding)}</b></div>
      <div class="k"><span>${monF(cm)} · ${t("collected")}</span><b class="num">${money(mo.collected)}</b></div><div class="k"><span>${monF(cm)} · ${t("expenses")}</span><b class="num">${money(mo.expenses)}</b></div></div>
    <div class="line small" style="margin-top:10px"><span>${monF(cm)}: ${t("paidCount",{a:n(c.paid),b:n(D.flats.length)})}</span><button class="small" style="color:var(--brand);font-weight:700" onclick="go('mem')">${t("details")} ›</button></div>
    <div class="prog"><i style="width:${Math.round(c.paid/D.flats.length*100)}%"></i></div></div>
  ${insightsCard()}`}
function insightsCard(){const it=(S.data.insights||{})[S.lang]||[];if(!it.length)return"";
  return `<div class="card"><h3>💡 ${t("insights")}</h3><div class="ins">${it.map(x=>`<div class="${esc(x.kind)}"><b>${esc(x.icon)}</b><span>${esc(x.text)}</span></div>`).join("")}</div></div>`}

function accView(){const D=S.data,T2=D.totals,net=T2.collected-T2.expenses,sel=S.accMonth,mo=D.months[sel];
  const max=Math.max(1,...D.months.map(m=>Math.max(m.collected,m.expenses)));
  const cats=Object.entries(D.category_year).sort((a,b)=>b[1]-a[1]),ctot=cats.reduce((s,x)=>s+x[1],0)||1;
  return `<div class="card"><div class="kp"><div class="k"><span>🏦 ${t("bank")}</span><b class="num">${money(D.balance)}</b></div>

    <div class="line" style="margin-top:8px"><span>${net>=0?"✅ "+t("saving"):"❌ "+t("deficit")} (${n(D.year)})</span><b class="num" style="color:var(--${net>=0?"good":"bad"})">${money(net,true)}</b></div></div>
  <div class="card"><h3>📈 ${t("chart")}</h3>
    <div class="chartWrap"><div class="chart">${D.months.map((m,i)=>i>lastMonth()?"":`<button class="cm${i===sel?" active":""}" onclick="setAccMonth(${i})" aria-label="${monF(i)}"><span class="bars"><i class="c-in" style="height:${Math.round(m.collected/max*100)}%"></i><i class="c-out" style="height:${Math.round(m.expenses/max*100)}%"></i></span><small>${mon(i)}</small></button>`).join("")}</div></div>

  <div class="card"><h3>🧾 ${t("expDetail")}</h3>${monthPills(sel,"setAccMonth")}
    <div class="chips" style="margin:10px 0 4px"><span class="chip info">📥 ${money(mo.collected)}</span><span class="chip warn">📤 ${money(mo.expenses)}</span><span class="chip ${mo.net>=0?"good":"bad"}">${mo.net>=0?t("saving"):t("deficit")} ${money(mo.net,true)}</span></div>
    ${mo.entries.length?`<div class="rows">${mo.entries.map(e=>{const p=splitEmoji(e[S.lang]||e.en);
      return `<div class="rw"><span class="em">${esc(p[0])}</span><span class="tx"><b>${esc(p[1])}</b><small>${fmtDate(e.date)}</small></span><span class="am num">${money(e.amount)}</span></div>`}).join("")}
      <div class="rw"><span class="em">Σ</span><span class="tx"><b>${t("total")} · ${monF(sel)}</b></span><span class="am num">${money(mo.expenses)}</span></div></div>`
      :`<div class="empty">${t("noExp")}</div>`}</div>
  <div class="card"><h3>🧮 ${t("cats")}</h3>${cats.map(([k,v])=>{const c=D.category_meta[k]||{};
    return `<div class="cat"><span>${esc(c.emoji||"")} ${esc(S.lang==="mr"?c.mr:c.en)}</span><b class="num">${money(v)} <span class="muted small">${n(Math.round(v/ctot*100))}%</span></b><div class="track"><i style="width:${Math.round(v/ctot*100)}%;background:${esc(c.color||"#6366f1")}"></i></div></div>`}).join("")}</div>`}
function splitEmoji(s){const i=s.indexOf(" ");return i>0&&i<=8?[s.slice(0,i),s.slice(i+1)]:["📝",s]}

/* ---------------------------------------------------------------- members */
function setMemMonth(m){const y=scrollY;S.memMonth=m;render();scrollTo(0,y)}
function memView(){const D=S.data,m=S.memMonth,c=monthCounts(m),mine=String(S.flat);
  const rank={due:0,partial:1,adj:2,paid:2,future:3};
  const list=D.flats.map((f,i)=>({f,i,s:status(f,m)})).sort((a,b)=>rank[a.s]-rank[b.s]||a.i-b.i);
  const chip=x=>x.s==="paid"?`<span class="chip good">✓ ${money(x.f.paid[m])}</span>`:x.s==="adj"?`<span class="chip good">✓ ${t("adj")}</span>`:
    x.s==="partial"?`<span class="chip warn">${money(x.f.paid[m])}</span>`:x.s==="due"?`<span class="chip bad">${t("due")}</span>`:`<span class="chip info">—</span>`;
  return `<div class="card"><h3>🗓 ${monF(m)} ${n(D.year)}</h3>${monthPills(m,"setMemMonth")}
    <div class="chips" style="margin-top:10px"><span class="chip good">✓ ${t("paid")} ${n(c.paid)}</span>${c.partial?`<span class="chip warn">${t("partial")} ${n(c.partial)}</span>`:""}<span class="chip bad">${t("pending")} ${n(c.due)}</span></div>
    <div class="prog"><i style="width:${Math.round(c.paid/D.flats.length*100)}%"></i></div></div>
  <div class="card"><div class="rows">${list.map(x=>`<button class="rw${String(x.f.no)===mine?" me":""}" onclick="flatSheet(${x.i})"><span class="em no">${n(x.f.no)}</span>
    <span class="tx"><b>${esc(x.f.name)}${String(x.f.no)===mine?` <span class="chip info">${t("you")}</span>`:""}</b><small>${x.f.outstanding>0?t("outstanding")+" "+money(x.f.outstanding):"✅ "+t("paid")}</small></span>
    <span class="am">${chip(x)}</span></button>`).join("")}</div></div>`}
function flatSheet(i){const D=S.data,f=D.flats[i],pend=pendingMonths(f);
  sheet(`<h2>${esc(f.name)}</h2><p class="muted" style="margin:0 0 14px">${t("flat")} ${n(f.no)}</p>
    <div class="kp" style="margin-bottom:14px"><div class="k"><span>${t("totalPaid")}</span><b class="num">${money(f.total)}</b></div>
      <div class="k ${f.outstanding>0?"bad":"good"}"><span>${f.outstanding<0?t("advance"):t("outstanding")}</span><b class="num">${money(Math.abs(f.outstanding))}</b></div></div>
    ${yearGrid(f)}
    ${pend.length&&f.outstanding>0?`<p class="small muted">${t("pendingMonths")}: ${pend.map(mon).join(", ")}</p>`:""}
    <p class="small muted">${t("rate")}: ${money(D.rate)}</p>
    ${String(f.no)===String(S.flat)&&f.outstanding>0?`<button class="btn primary" onclick="paySheet()">💳 ${t("payNow")}</button>`:""}`)}

/* ---------------------------------------------------------------- notices */
function notView(){const N=S.data.notices;return N.length?N.map(noticeCard).join(""):`<div class="card empty">📭<br>${t("noNotices")}</div>`}

/* ---------------------------------------------------------------- more */
function moreView(){const f=me(),dark=document.documentElement.getAttribute("data-theme")==="dark";
  const item=(em,title,sub,fn)=>`<button class="rw" onclick="${fn}"><span class="em">${em}</span><span class="tx"><b>${title}</b>${sub?`<small>${sub}</small>`:""}</span><span class="muted">›</span></button>`;
  return `<div class="card"><div class="rows">
    ${item("💳",t("payMaint"),t("payMaintS"),"paySheet()")}
    ${item("📝",t("complaint"),t("complaintS"),"complaintSheet()")}
    ${item("💬",t("contact"),t("contactS"),"contactCommittee()")}</div></div>
  <div class="card"><div class="rows">
    ${item("🏠",t("changeFlat"),esc(f.name)+" · "+t("flat")+" "+n(f.no),"pickScreen()")}
    ${item("🌐",t("language"),t("languageS"),"toggleLang()")}
    ${item(dark?"🌙":"☀️",t("theme"),dark?t("themeD"):t("themeL"),"toggleTheme()")}
    ${item("⟳",t("refresh"),t("updated")+": "+fmtStamp(S.data.updated),"refresh()")}</div></div>
  <div class="card"><div class="rows">
    ${STANDALONE?"":item("📲",t("install"),t("installS"),"installSheet()")}
    ${item("👨‍👩‍👧",t("share"),t("shareS"),"shareApp()")}
    ${item("🔒",t("lock"),t("lockS"),"lockApp()")}</div></div>`}
function contactCommittee(){const f=me();wa(`🏢 ${bname()}\n${t("flat")} ${f.no} - ${f.name}\n\n${t("hi")}`,S.data.contact.phone)}
function shareApp(){const url=location.origin+location.pathname+"#k="+S.pass,text=`🏢 ${bname()}\n${t("shareTxt")}`;
  if(navigator.share)navigator.share({title:bname(),text,url}).catch(()=>{});else copyText(text+"\n"+url)}

/* ---------------------------------------------------------------- pay */
function paySheet(){const D=S.data,f=me(),c=D.contact;
  if(!c.upi)return sheet(`<h2>💳 ${t("payTitle")}</h2><p>${t("noUpi")}</p><button class="btn wa" onclick="contactCommittee()">💬 ${t("contact")}</button>`);
  const opts=[];if(f.outstanding>0)opts.push([Math.round(f.outstanding),t("fullDue")]);
  if(Math.round(f.outstanding)!==D.rate)opts.push([D.rate,t("oneMonth")]);
  S.payAmt=opts[0][0];
  sheet(`<h2>💳 ${t("payTitle")}</h2><p class="muted" style="margin:0">${esc(f.name)} · ${t("flat")} ${n(f.no)}</p>
    <div class="opts" id="payOpts">${opts.map((o,i)=>`<button class="opt${i===0?" active":""}" data-v="${o[0]}" onclick="setPay(${o[0]},this)"><span>${o[1]}</span><b class="num">${money(o[0])}</b></button>`).join("")}
      <div class="opt" id="payOtherRow"><span>${t("other")}</span><input id="payOther" type="number" inputmode="numeric" min="1" placeholder="₹" oninput="setPay(+this.value,this.parentNode)" onfocus="setPay(+this.value,this.parentNode)"></div></div>
    <div class="payto"><div><small>${t("upiId")}</small><b>${esc(c.upi)}</b><small>${esc(c.payee)}</small></div><button onclick="copyText(S.data.contact.upi)">📋 ${t("copy")}</button></div>
    <button class="btn primary" onclick="openUpi()">📲 ${t("openUpi")} · <span id="payLbl" class="num">${money(S.payAmt)}</span></button>
    <p class="help">${t("payHelp")}</p>
    <button class="btn wa" onclick="informPaid()">💬 ${t("inform")}</button>
    <p class="help">${t("informHelp")}</p>`)}
function setPay(v,el){S.payAmt=v>0?Math.round(v):0;document.querySelectorAll("#payOpts .opt").forEach(o=>o.classList.toggle("active",o===el));$("payLbl").textContent=S.payAmt?money(S.payAmt):"₹"}
function openUpi(){if(!S.payAmt)return toast(t("needAmt"));const c=S.data.contact,f=me();
  const q=new URLSearchParams({pa:c.upi,pn:c.payee,am:S.payAmt.toFixed(2),cu:"INR",tn:"Flat "+f.no+" maintenance"});
  location.href="upi://pay?"+q.toString().replace(/\+/g,"%20")}
function informPaid(){if(!S.payAmt)return toast(t("needAmt"));const f=me(),d=new Date();
  wa(`🏢 *${bname()}*\n💰 *${t("pHead")}*\n\n👤 ${f.name} (${t("flat")} ${n(f.no)})\n💵 ${t("amount")}: ${money(S.payAmt)}\n🗓 ${t("date")}: ${n(d.getDate())} ${monF(d.getMonth())} ${n(d.getFullYear())}\n\n${t("paidMsg")} 🙏`,S.data.contact.phone)}

/* ---------------------------------------------------------------- complaint */
function complaintSheet(){const kinds=["cWater","cLight","cClean","cPark","cCctv","cOther"];
  sheet(`<h2>📝 ${t("complaint")}</h2><p class="muted" style="margin:0">${t("complaintS")}</p>
    <label>${t("type")}<select id="cType">${kinds.map(k=>`<option>${t(k)}</option>`).join("")}</select></label>
    <label>${t("message")}<textarea id="cText" rows="4" maxlength="800" placeholder="${t("cPh")}"></textarea></label>
    <div style="height:16px"></div><button class="btn wa" onclick="sendComplaint()">💬 ${t("send")}</button>`)}
function sendComplaint(){const txt=$("cText").value.trim();if(!txt)return toast(t("needMsg"));const f=me();
  wa(`🏢 *${bname()}*\n📝 *${t("cHead")}*\n\n👤 ${f.name} (${t("flat")} ${n(f.no)})\n🏷 ${t("type")}: ${$("cType").value}\n\n${txt}`,S.data.contact.phone);closeSheet()}

/* ---------------------------------------------------------------- install */
addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.installEvt=e});
addEventListener("appinstalled",()=>{S.installEvt=null;LS.set("noInstall",true)});
function installSheet(){
  if(S.installEvt){S.installEvt.prompt();S.installEvt.userChoice.then(()=>{S.installEvt=null}).catch(()=>{});return}
  sheet(`<h2>📲 ${t("install")}</h2><ol class="steps">${t(IOS?"instI":"instA").map(s=>`<li>${s}</li>`).join("")}</ol>`)}

/* ---------------------------------------------------------------- bottom sheet */
function sheet(html){$("sheet").innerHTML='<div class="grab"></div>'+html;$("sheet").scrollTop=0;$("ov").classList.add("show")}
function closeSheet(){$("ov").classList.remove("show")}
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------------------------------------------------------------- start */
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.data&&Date.now()-S.loadedAt>5*60*1000)loadData()});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
readLink();
loadData();
</script>
</body>
</html>
