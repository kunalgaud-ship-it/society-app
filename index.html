<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Om Gurudev Residency</title>
<meta name="theme-color" content="#1e1b4b">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Om Gurudev">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#f3f5fb; --glassBg:rgba(243,245,251,.82); --panel:#ffffff; --panel2:#f1f4fa; --line:rgba(15,23,42,.08); --text:#0b1020; --muted:#667085;
  --brand:#4f46e5; --brand2:#7c3aed; --brand3:#c026d3; --brandSoft:rgba(79,70,229,.1); --gold:#f59e0b;
  --good:#059669; --goodSoft:rgba(5,150,105,.12); --bad:#e11d48; --badSoft:rgba(225,29,72,.1); --warn:#b45309; --warnSoft:rgba(245,158,11,.17);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 14px 34px -18px rgba(16,24,40,.2); --glow:0 18px 40px -16px rgba(79,70,229,.6);
  --glass:rgba(255,255,255,.86); --aura1:rgba(99,102,241,.2); --aura2:rgba(192,38,211,.14);
  --tabH:66px;
}
:root[data-theme="dark"]{
  --bg:#060914; --glassBg:rgba(6,9,20,.8); --panel:#0f1629; --panel2:#0a1020; --line:rgba(148,163,184,.13); --text:#e8ecf6; --muted:#8a96ad;
  --brand:#818cf8; --brand2:#a78bfa; --brand3:#e879f9; --brandSoft:rgba(129,140,248,.18); --gold:#fbbf24;
  --good:#34d399; --goodSoft:rgba(52,211,153,.14); --bad:#fb7185; --badSoft:rgba(251,113,133,.16); --warn:#fbbf24; --warnSoft:rgba(251,191,36,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 36px -20px rgba(0,0,0,.8); --glass:rgba(15,22,41,.86); --aura1:rgba(99,102,241,.28); --aura2:rgba(192,38,211,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Plus Jakarta Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,"Nirmala UI",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:360px;z-index:-1;pointer-events:none;background:radial-gradient(70% 100% at 0% 0%,var(--aura1),transparent 70%),radial-gradient(60% 90% at 100% 0%,var(--aura2),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brandSoft)}
.ic{width:20px;height:20px;flex-shrink:0;display:block}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(var(--tabH) + 40px + env(safe-area-inset-bottom));min-height:100vh}
.muted{color:var(--muted)} .small{font-size:12.5px} .num{font-variant-numeric:tabular-nums}
/* header */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -14px 4px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--glassBg);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand img{width:44px;height:44px;border-radius:14px;box-shadow:0 8px 20px -8px rgba(30,27,75,.7)}
.brand b{display:block;font-size:16px;font-weight:800;line-height:1.2;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.brand small i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--goodSoft)}
.brand small i.off{background:var(--gold);box-shadow:0 0 0 3px var(--warnSoft)}
.hbtns{display:flex;gap:8px;flex-shrink:0}
.hbtns button{width:40px;height:40px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:15px;box-shadow:var(--shadow);display:grid;place-items:center}
.hbtns button.spin .ic{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{border-radius:16px;padding:11px 14px;font-size:13px;font-weight:600}
.banner.warn{background:var(--warnSoft);color:var(--warn);display:flex;gap:9px;align-items:center}
.banner.info{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;gap:11px}
.banner.info .t{width:36px;height:36px}
.banner.info .msg{flex:1;min-width:0}
.banner.info button.go{font-weight:800;padding:8px 13px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:12.5px;white-space:nowrap}
.banner.info button.x{color:var(--muted);padding:6px}
/* cards */
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stack.enter>*{animation:in .5s cubic-bezier(.2,.8,.2,1) both}
.stack.enter>*:nth-child(2){animation-delay:.05s}.stack.enter>*:nth-child(3){animation-delay:.1s}.stack.enter>*:nth-child(4){animation-delay:.15s}.stack.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:17px}
.card h3{margin:0 0 13px;font-size:14.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.card h3 .sp{flex:1}
.card h3 button{font-size:12.5px;font-weight:700;color:var(--brand);display:flex;align-items:center;gap:2px}
.card h3 button .ic{width:15px;height:15px}
.t{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:linear-gradient(135deg,#6366f1,#4338ca)}
.t.sm{width:30px;height:30px;border-radius:10px}.t.sm .ic{width:16px;height:16px}
.t.c2{background:linear-gradient(135deg,#fb7185,#e11d48)} .t.c3{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.t.c4{background:linear-gradient(135deg,#34d399,#059669)} .t.c5{background:linear-gradient(135deg,#38bdf8,#0284c7)}
.t.c6{background:linear-gradient(135deg,#c084fc,#9333ea)} .t.c7{background:linear-gradient(135deg,#94a3b8,#475569)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;color:#fff;background:linear-gradient(135deg,#1e1b4b 0%,#4338ca 48%,#7c3aed 78%,#c026d3 115%);box-shadow:var(--glow)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(360px 200px at 100% 0%,rgba(255,255,255,.26),transparent 60%),radial-gradient(260px 200px at 0% 110%,rgba(251,191,36,.22),transparent 60%)}
.hero::after{content:"";position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.4px);background-size:18px 18px;-webkit-mask-image:linear-gradient(120deg,transparent 45%,#000);mask-image:linear-gradient(120deg,transparent 45%,#000)}
.hero>*{position:relative;z-index:1}
.hrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hero .who{font-size:13px;opacity:.85;font-weight:600}
.hero .nm{font-size:19px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.25}
.hero .tag{display:inline-flex;margin-top:7px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}
.hero .lbl{margin-top:16px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;opacity:.8}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.025em;line-height:1.12}
.hero .sub{font-size:13.5px;opacity:.92;margin-top:3px;font-weight:600}
.hero .acts{display:flex;gap:9px;margin-top:17px;flex-wrap:wrap}
.hero .acts button{padding:12px 17px;border-radius:15px;font-weight:800;font-size:14.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.34);color:#fff;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px)}
.hero .acts button.main{background:#fff;color:#4338ca;border-color:#fff;box-shadow:0 12px 24px -10px rgba(0,0,0,.5)}
.ring{position:relative;width:78px;height:78px;flex-shrink:0}
.ring svg{width:100%;height:100%}
.ring .rt{fill:none;stroke:rgba(255,255,255,.2);stroke-width:7}
.ring .rv{fill:none;stroke:#fbbf24;stroke-width:7;stroke-linecap:round;transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring b{font-size:17px;font-weight:800}.ring small{font-size:9.5px;opacity:.85;font-weight:700}
/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:13px 4px 11px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12px;font-weight:700;position:relative}
.qa .t{width:46px;height:46px;border-radius:15px}.qa .t .ic{width:22px;height:22px}
.qa .dot{position:absolute;top:9px;right:calc(50% - 27px);width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--panel)}
/* month grid */
.yg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mc{border-radius:15px;padding:10px 4px 9px;text-align:center;background:var(--panel2);border:1.5px solid transparent;position:relative}
.mc small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.mc b{display:block;font-size:14px;margin-top:2px;font-weight:800}
.mc.paid,.mc.adj{background:var(--goodSoft)} .mc.paid b,.mc.adj b{color:var(--good)}
.mc.partial{background:var(--warnSoft)} .mc.partial b{color:var(--warn)}
.mc.due{background:var(--badSoft)} .mc.due b{color:var(--bad)}
.mc.future b,.mc.none b{color:var(--muted);font-weight:500}
button.mc{width:100%;font:inherit}
.mc.now{border-color:var(--brand)}
.mc.now::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:13px;font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:0;margin-right:5px}
/* key figures */
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kp .k{background:var(--panel2);border-radius:16px;padding:12px 13px;overflow-wrap:anywhere}
.kp .k span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.kp .k span .ic{width:14px;height:14px}
.kp .k b{font-size:19px;letter-spacing:-.015em;font-weight:800}
.kp .k.good b{color:var(--good)} .kp .k.bad b{color:var(--bad)}
.prog{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2),var(--brand3))}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0}
.line b{white-space:nowrap}
.link{color:var(--brand);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:2px}
.link .ic{width:15px;height:15px}
/* balance card */
.bal{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#fff;background:linear-gradient(140deg,#0b1020,#1e1b4b 55%,#4338ca 120%);box-shadow:0 20px 44px -20px rgba(11,16,32,.8)}
.bal::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-130px;background:radial-gradient(circle,rgba(251,191,36,.34),transparent 65%)}
.bal::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;left:-110px;bottom:-150px;background:radial-gradient(circle,rgba(192,38,211,.4),transparent 65%)}
.bal>*{position:relative;z-index:1}
.bal .lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;opacity:.75;display:flex;align-items:center;gap:7px}
.bal .big{font-size:38px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-top:2px}
.bal .io{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.bal .io div{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:11px 12px;overflow-wrap:anywhere}
.bal .io span{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;opacity:.8}
.bal .io span .ic{width:14px;height:14px}
.bal .io b{font-size:17px;font-weight:800}
.bal .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-size:13px;font-weight:700}
.bal .ft b{padding:4px 11px;border-radius:99px;background:rgba(52,211,153,.2);color:#6ee7b7}
.bal .ft b.neg{background:rgba(251,113,133,.2);color:#fda4af}
/* pills */
.pills{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:8px 15px;border-radius:13px;font-weight:700;font-size:13.5px;background:var(--panel2);border:1px solid var(--line)}
.pill.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:var(--glow)}
/* bar chart */
.chartWrap{overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.chartWrap::-webkit-scrollbar{display:none}
.chart{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(31px,1fr);gap:2px;align-items:end;height:164px;padding:6px 4px 0}
.cm{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;border-radius:12px;padding:4px 0;min-width:0}
.cm.active{background:var(--brandSoft)}
.cm .bars{display:flex;gap:3px;align-items:flex-end;flex:1;width:100%;justify-content:center}
.cm .bars i{display:block;width:9px;border-radius:5px;min-height:3px}
.cm small{font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.cm.active small{color:var(--brand)}
.c-in{background:linear-gradient(180deg,#818cf8,#4f46e5)} .c-out{background:linear-gradient(180deg,#fcd34d,#f59e0b)}
/* donut */
.dn{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.donut{width:128px;height:128px;flex-shrink:0}
.dn .mid{flex:1;min-width:0}
.dn .mid span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.dn .mid b{font-size:22px;font-weight:800;letter-spacing:-.02em}
/* lists */
.rows{display:grid}
.rw{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.rw:last-child{border-bottom:0}
.rw .tx{flex:1;min-width:0}
.rw .tx b{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .tx small{color:var(--muted);font-size:12.5px;font-weight:500}
.rw .am{font-weight:800;white-space:nowrap;text-align:right}
.rw .go{color:var(--muted);width:17px;height:17px}
.rw.me{background:var(--brandSoft);border-radius:16px;padding:11px 10px;margin:3px -10px;border-bottom:0;width:calc(100% + 20px)}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;color:#fff;font-weight:800;font-size:14px;letter-spacing:.02em}
.ct{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.chip .ic{width:13px;height:13px;stroke-width:3}
.chip.good{background:var(--goodSoft);color:var(--good)} .chip.bad{background:var(--badSoft);color:var(--bad)}
.chip.warn{background:var(--warnSoft);color:var(--warn)} .chip.info{background:var(--brandSoft);color:var(--brand)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px;padding:7px 0;font-weight:600}
.cat b{white-space:nowrap}
.cat>span{display:flex;align-items:center;gap:8px;min-width:0}
.cat>span i{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat .track{grid-column:1/3;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.cat .track i{display:block;height:100%;border-radius:99px}
.ins{display:grid;gap:8px}
.ins div{display:flex;gap:11px;padding:11px 13px;border-radius:15px;background:var(--panel2);border-left:4px solid var(--brand);font-size:13.5px;font-weight:500}
.ins div.good{border-color:var(--good)} .ins div.bad{border-color:var(--bad)} .ins div.warn{border-color:var(--gold)}
.notice{white-space:pre-wrap;overflow-wrap:anywhere;position:relative;overflow:hidden}
.notice h3{white-space:normal}
.notice .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px;white-space:normal}
.notice .hd b{font-size:15.5px;font-weight:800;line-height:1.35}
.notice .hd small{color:var(--muted);white-space:nowrap;font-size:12px;font-weight:600;padding-top:3px}
.notice .bd{color:var(--muted);font-weight:500}
.notice.pin{padding-left:21px}
.notice.pin::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--gold),var(--brand3))}
.notice .chip{margin-bottom:8px}
.cb{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;background:var(--brandSoft);color:var(--brand);text-decoration:none}
.cb.w{background:rgba(31,190,92,.14);color:#15a34a}
.rc{position:relative;text-align:center;border-radius:22px;padding:22px 18px 16px;margin-bottom:16px;background:var(--panel2);border:1.5px dashed var(--line);display:grid;justify-items:center;gap:4px}
.rc img{width:56px;height:56px;border-radius:17px;box-shadow:0 12px 26px -12px rgba(30,27,75,.8);margin-bottom:6px}
.rc>b{font-size:16px;font-weight:800}
.rc>span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.rc .amt{font-size:36px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.rc dl{width:100%;margin:14px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;text-align:left;border-top:1.5px dashed var(--line);padding-top:14px}
.rc dt{color:var(--muted);font-size:13px;font-weight:600}
.rc dd{margin:0;text-align:right;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.rc p{margin:14px 0 0;font-size:11.5px;color:var(--muted);font-weight:500}
.empty{padding:30px 10px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center;font-weight:600}
.empty .t{width:54px;height:54px;border-radius:18px}.empty .t .ic{width:26px;height:26px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:15.5px;background:var(--panel2);border:1px solid var(--line)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2) 60%,var(--brand3) 130%);color:#fff;border-color:transparent;box-shadow:var(--glow)}
:root[data-theme="dark"] .btn.primary{background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#c026d3 130%)}
.btn.wa{background:#1fbe5c;color:#fff;border-color:transparent;box-shadow:0 14px 30px -16px rgba(31,190,92,.8)}
.btn:active,.pill:active,.rw:active,.qa button:active,.hero .acts button:active,#tabs button:active{transform:scale(.97)}
.help{font-size:12.5px;color:var(--muted);margin:9px 2px 17px;font-weight:500}
/* tab bar */
#tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:none}
#tabs .in{max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;height:var(--tabH);padding:6px;border-radius:24px;background:var(--glass);border:1px solid var(--line);box-shadow:0 20px 44px -16px rgba(16,24,40,.45);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative;border-radius:18px;transition:background .25s,color .25s}
#tabs button .ic{width:22px;height:22px}
#tabs button.active{color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 10px 22px -10px rgba(79,70,229,.9)}
#tabs button .dot{position:absolute;top:7px;left:calc(50% + 7px);width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--panel)}
/* bottom sheet */
#ov{position:fixed;inset:0;z-index:40;background:rgba(3,6,18,.6);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#ov.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#sheet{background:var(--panel);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:30px 30px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
#sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 16px}
#sheet .sh{display:flex;align-items:center;gap:12px;margin-bottom:4px}
#sheet .sh .t{width:46px;height:46px;border-radius:15px}
#sheet h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
#sheet .sh p{margin:1px 0 0;color:var(--muted);font-size:13px;font-weight:600}
#sheet label{display:grid;gap:7px;font-size:13px;font-weight:700;color:var(--muted);margin-top:15px}
.opts{display:grid;gap:9px;margin:16px 0}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 15px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel2);font-weight:700;width:100%;text-align:left}
.opt.active{border-color:var(--brand);background:var(--brandSoft)}
.opt input{width:130px;padding:9px 11px;text-align:right}
.payto{display:flex;align-items:center;gap:11px;padding:14px 15px;border-radius:16px;background:var(--panel2);margin-bottom:15px}
.payto div{flex:1;min-width:0}
.payto small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.payto b{display:block;font-size:16px;overflow-wrap:anywhere}
.payto button{padding:10px 13px;border-radius:12px;background:var(--brandSoft);color:var(--brand);font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.payto button .ic{width:16px;height:16px}
.payhd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 3px 9px;font-weight:800;font-size:14px}
.payhd .payLbl{color:var(--brand);font-size:16px}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:9px}
.apps button{display:grid;justify-items:center;gap:8px;padding:14px 6px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel2);font-weight:800;font-size:13px}
.apps button.active{border-color:var(--brand);background:var(--brandSoft)}
.apps button:active{transform:scale(.97)}
.apps i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:16px}
.qrc{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--panel2);margin-bottom:16px}
#payQr{width:132px;height:132px;flex-shrink:0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line)}
#payQr svg{width:100%;height:100%;display:block}
.qrc>div:last-child{display:grid;gap:5px;justify-items:start;min-width:0}
.qrc b{font-size:14.5px;font-weight:800}
.qrc small{color:var(--muted);font-size:12.5px;font-weight:500}
.steps{margin:14px 0 4px;padding:0;list-style:none;display:grid;gap:11px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;font-weight:600}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:10px;background:var(--brandSoft);color:var(--brand);font-weight:800;display:grid;place-items:center;flex-shrink:0;font-size:13px}
/* splash / lock / picker */
.center{min-height:100vh;display:grid;place-items:center;padding:24px 0}
.center .box{width:100%;text-align:center}
.logo{width:96px;height:96px;border-radius:28px;box-shadow:0 24px 50px -18px rgba(30,27,75,.85)}
.center h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:18px 0 4px}
.center p{color:var(--muted);margin:0 0 18px;font-weight:500}
.center .err,#pinErr{color:var(--bad);font-weight:700;min-height:22px;margin:10px 0}
#pinErr{text-align:center}
.center input{text-align:center;font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
.lockc{padding:22px 18px;text-align:center}
.lockc .t{margin:0 auto 10px;width:48px;height:48px;border-radius:16px}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pick{display:grid;text-align:left;margin-top:6px}
#toasts{position:fixed;left:14px;right:14px;bottom:calc(var(--tabH) + 26px + env(safe-area-inset-bottom));z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:#0b1020;color:#fff;padding:12px 17px;border-radius:15px;font-weight:700;font-size:13.5px;box-shadow:0 18px 40px -12px rgba(0,0,0,.7);animation:in .25s both;border:1px solid rgba(255,255,255,.1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

/* ---------------------------------------------------------------- data rules (same as the committee's sheet) */
function me(){return S.data.flats.find(f=>String(f.no)===String(S.flat))}
function curMonth(){return S.data.year===NOW.getFullYear()?NOW.getMonth():11}
/* Members see dues for the CURRENT month only. Other months show what was paid, never what
   is pending (the committee follows up older dues itself). */
function dueTo(){return Math.min(12,curMonth()+1)}
/* >= 0 when everything up to this month is covered overall (e.g. two months paid in one entry) */
function credit(f){const k=dueTo();let s=0;for(let m=0;m<k;m++)s+=f.paid[m];return s-S.data.rate*k}
/* current month: paid / partial / due, or "adj" when the entry is short but covered by other
   months. Any other month: paid (something was received), none (earlier) or future. */
function status(f,m){const v=f.paid[m],cm=curMonth();
  if(m!==cm)return v>0?"paid":m<cm?"none":"future";
  if(v>=S.data.rate)return"paid";
  if(credit(f)>=0)return"adj";
  return v>0?"partial":"due"}
function monthDue(f,m){const s=status(f,m);return s==="due"||s==="partial"?Math.round(S.data.rate-f.paid[m]):0}
function monthDueAll(m){return S.data.flats.reduce((s,f)=>s+monthDue(f,m),0)}
function monthCounts(m){const c={paid:0,partial:0,due:0};S.data.flats.forEach(f=>{const s=status(f,m);if(s==="paid"||s==="adj")c.paid++;else if(s==="partial")c.partial++;else if(s==="due")c.due++});return c}

/* ---------------------------------------------------------------- unlock */
function b64(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function decrypt(enc,pass){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(normPass(pass)),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},key,b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain))}

function readLink(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("k"))S.linkKey=normPass(h.get("k"));
  if(h.get("flat")){S.flat=h.get("flat");LS.set("flat",S.flat);S.linkFlat=S.flat;LS.set("linkFlat",S.flat)}      // a personal invite always sets the flat
  if(TABS.includes(h.get("tab")))S.tab=h.get("tab")}
/* The working key stays in the address, so a bookmark, a home-screen shortcut or "open in
   browser" still opens the app on phones that do not keep saved data. */
function keepLink(){try{history.replaceState(null,"",location.pathname+location.search+(S.pass&&S.data?"#k="+S.pass:""))}catch(e){}}

async function loadData(){
  if(!window.crypto||!crypto.subtle)return fatal("insecure");
  let enc=null;
  try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);enc=await r.json();LS.set("enc",enc);S.offline=false}
  catch(e){enc=LS.get("enc",null);S.offline=true}
  if(!enc)return fatal("fatal");
  S.enc=enc;S.loadedAt=Date.now();
  return openData()}
async function openData(){
  const keys=[...new Set([S.linkKey,S.pass,LS.get("pass","")].filter(Boolean))];   // link first, then the saved one
  if(!keys.length)return lockScreen("");
  let data=null;
  for(const k of keys){try{data=await decrypt(S.enc,k);S.pass=k;break}catch(e){}}
  S.data=data;
  if(!data){keepLink();return lockScreen(LS.get("opened",false)?"changed":"wrong")}
  LS.set("pass",S.pass);LS.set("opened",true);keepLink();
  if(S.accMonth===null){const cm=curMonth();let m=cm;while(m>0&&!S.data.months[m].entries.length)m--;S.accMonth=m;S.memMonth=cm}
  if(!me())return pickScreen();
  checkPayments();render();return true}

    ${STORE_OK?"":`<div class="banner warn" style="margin-top:14px;text-align:left">${ic("alert")}<span>${t("noStore")}</span></div>`}

    <p class="small muted" style="opacity:.7">${esc(diag())}</p></form></div>`}

function tryPass(ev){ev.preventDefault();const v=normPass($("passIn").value);if(!v)return false;S.linkKey=v;S.pass=v;S.enter=true;openData();return false}
/* Only the committee's flat may switch flats, and only on a phone that was opened with that
   flat's personal invite link. The option is there only while that flat is showing: after
   switching to another flat the phone is locked like a member's, and the committee comes back
   by opening its own link again. Members choose once; a wrong choice is corrected with the
   personal invite link from the committee. */
function adminFlat(){return String(S.data.admin_flat??"7")}
function isAdmin(){const a=adminFlat();LS.del("admin");
  return String(S.flat)===a&&(S.linkFlat===a||LS.get("linkFlat","")===a)}
/* With a committee PIN set, the flats can be switched only after the PIN. The data holds a slow
   hash of the PIN, never the PIN itself. */
function canSwitch(){return isAdmin()&&(!S.data.admin_lock||S.pinOk===true)}
function changeFlat(){if(!isAdmin())return;if(!S.data.admin_lock)return pickScreen();
  if(LS.get("pinWait",0)>Date.now()||S.pinWait>Date.now())return toast(t("pinWait"));
  sheet(`${sheetHead("lock","",t("pinTitle"),t("pinHint"))}
    <form onsubmit="return tryPin(event)" style="margin-top:16px"><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••••" aria-label="${t("pinTitle")}" style="text-align:center;font-size:20px;letter-spacing:.3em;font-weight:800">
    <div class="err" id="pinErr"></div><button class="btn primary" type="submit">${ic("check")}${t("pinOpen")}</button></form>`);
  setTimeout(()=>{const e=$("pinIn");if(e)e.focus()},60)}
async function pinOk(pin){const L=S.data.admin_lock;
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(L.salt),iterations:L.iter,hash:"SHA-256"},km,256));
  return btoa(String.fromCharCode(...bits))===L.hash}
function tryPin(ev){ev.preventDefault();const pin=$("pinIn").value.replace(/\s/g,"");if(!pin)return false;
  pinOk(pin).then(ok=>{if(ok){S.pinBad=0;S.pinOk=true;closeSheet();return pickScreen()}
    S.pinBad=(S.pinBad||0)+1;if($("pinIn"))$("pinIn").value="";
    if(S.pinBad>=5){S.pinBad=0;S.pinWait=Date.now()+60000;LS.set("pinWait",S.pinWait);closeSheet();return toast(t("pinWait"))}
    if($("pinErr"))$("pinErr").textContent=t("pinWrong")});
  return false}
function pickScreen(){hideTabs();const adm=canSwitch();
  $("app").innerHTML=`<div class="center" style="place-items:start center"><div class="box"><img class="logo" src="icon-192.png" alt=""><h1>${t("pickTitle")}</h1><p>${t(adm?"pickAdmin":"pickHint")}</p>
    <div class="card pick">${S.data.flats.map((f,i)=>!adm&&String(f.no)===adminFlat()?"":`<button class="rw" onclick="pickFlat(${i})">${avatar(f,i)}<span class="tx"><b>${esc(f.name)}</b><small>${t("flat")} ${n(f.no)}</small></span><span class="go">${ic("next")}</span></button>`).join("")}</div></div></div>`;
  scrollTo(0,0)}
function pickFlat(i){const f=S.data.flats[i],adm=canSwitch();if(adm&&String(f.no)===adminFlat())return setFlat(i);
  sheet(`<div class="sh">${avatar(f,i)}<div><h2>${esc(f.name)}</h2><p>${t("flat")} ${n(f.no)}</p></div></div>
    <div class="banner warn" style="margin:16px 0">${ic("alert")}<span>${t(adm?"pickLock":"pickSure")}</span></div>
    <button class="btn primary" onclick="setFlat(${i})">${ic("check")}${t(adm?"pickView":"pickYes")}</button><div style="height:10px"></div><button class="btn" onclick="closeSheet()">${t("back")}</button>`)}
function setFlat(i){if(!canSwitch()&&String(S.data.flats[i].no)===adminFlat())return;
  if(me()&&!canSwitch())return;                     // a flat is already saved on this phone: locked
  S.flat=String(S.data.flats[i].no);LS.set("flat",S.flat);S.pinOk=false;S.tab="home";S.enter=true;closeSheet();render();scrollTo(0,0)}
function wrongFlat(){const f=me();wa(`🏢 ${bname()}\n${t("flat")} ${f.no} - ${f.name}\n\n${t("wrongMsg")}`,S.data.contact.phone)}

/* ---------------------------------------------------------------- shell */
function hideTabs(){$("tabs").style.display="none";closeSheet()}
function unseen(){const seen=LS.get("seen",0);return S.data.notices.some(x=>x.id>seen)}
function renderTabs(){$("tabs").style.display="block";
  $("tabsIn").innerHTML=TABS.map(k=>`<button class="${S.tab===k?"active":""}" onclick="go('${k}')">${ic(TAB_ICON[k])}<span>${t(k)}</span>${k==="not"&&unseen()?'<span class="dot"></span>':""}</button>`).join("")}
function go(tab){S.tab=tab;S.enter=true;closeSheet();render();scrollTo(0,0)}
function header(){return `<header class="top"><div class="brand"><img src="icon-192.png" alt=""><div><b>${esc(bname())}</b><small><i class="${S.offline?"off":""}"></i>${t("updated")}: ${fmtStamp(S.data.updated)}</small></div></div>
  <div class="hbtns"><button onclick="toggleLang()" aria-label="${t("language")}">${S.lang==="mr"?"A":"अ"}</button><button id="refBtn" onclick="refresh()" aria-label="${t("refresh")}">${ic("refresh")}</button></div></header>
  ${S.offline?`<div class="banner warn" style="margin-bottom:12px">${ic("wifi")}<span>${t("offline")}</span></div>`:""}`}
function render(){if(!S.data)return;
  document.documentElement.lang=S.lang;
  if(S.tab==="not"&&S.data.notices.length)LS.set("seen",Math.max(...S.data.notices.map(x=>x.id)));
  const enter=S.enter;S.enter=false;
  $("app").innerHTML=header()+`<div class="stack${enter?" enter":""}">${({home:homeView,acc:accView,mem:memView,not:notView,more:moreView})[S.tab]()}</div>`;
  renderTabs();keepPill();if(enter)countUp()}
function countUp(){if(CALM)return;
  document.querySelectorAll("[data-count]").forEach(el=>{const v=+el.dataset.count,t0=performance.now();
    const step=now=>{const p=Math.min(1,(now-t0)/750),e=1-Math.pow(1-p,3);el.textContent=money(p<1?v*e:v);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function toggleLang(locked){S.lang=S.lang==="mr"?"en":"mr";LS.set("lang",S.lang);if(locked)lockScreen("");else render()}
function toggleTheme(){setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");render()}
async function refresh(){const b=$("refBtn");if(b)b.classList.add("spin");await loadData();toast(S.offline?t("noNet"):t("refreshed"))}
function lockApp(){S.pass="";S.linkKey="";S.data=null;LS.del("pass");keepLink();lockScreen("")}

/* ---------------------------------------------------------------- shared pieces */
/* in the member's own grid a paid month opens its receipt */
function yearGrid(f){const cm=curMonth(),own=String(f.no)===String(S.flat);
  return `<div class="yg">${f.paid.map((v,m)=>{const s=status(f,m),tag=own&&v>0?"button":"div";
    return `<${tag} class="mc ${s}${m===cm?" now":""}"${tag==="button"?` onclick="receiptSheet(${m})"`:""}><small>${mon(m)}</small><b class="num">${v>0?money(v):s==="due"?t("due"):s==="adj"?"✓":"—"}</b></${tag}>`}).join("")}</div>
  <div class="legend"><span><i style="background:var(--good)"></i>${t("paid")}</span><span><i style="background:var(--bad)"></i>${mon(cm)} ${t("due")}</span></div>`}
function daysTo(iso){const p=iso.split("-");return Math.round((new Date(+p[0],+p[1]-1,+p[2])-new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()))/864e5)}
function eventChip(x){if(!x.event)return"";const d=daysTo(x.event);if(d<0)return"";
  return `<span class="chip info">${ic("cal")}${fmtDate(x.event)} · ${d===0?t("today"):d===1?t("tomorrow"):t("inDays",{n:n(d)})}</span>`}
function dueLine(){const d=S.data.due_day,day=NOW.getDate();if(!d||S.data.year!==NOW.getFullYear())return"";
  return day<d?t("dueBy",{d:n(d)+" "+mon(curMonth())}):day===d?t("dueToday"):t("overdue",{n:n(day-d)})}
function noticeBody(x){const chips=(x.pinned?`<span class="chip warn">${ic("pin")}${t("important")}</span>`:"")+eventChip(x);
  return `${chips?`<div class="chips" style="margin-bottom:8px;white-space:normal">${chips}</div>`:""}<div class="hd"><b>${esc(x.title)}</b><small>${fmtDate(x.date)}</small></div>${x.body?`<div class="bd">${esc(x.body)}</div>`:""}`}
function noticeCard(x){return `<div class="card notice${x.pinned?" pin":""}">${noticeBody(x)}</div>`}
/* last month worth showing: the current one, or later if the sheet already has figures there */
function lastMonth(){let last=curMonth();
  S.data.months.forEach((m,i)=>{if(m.collected||m.expenses)last=Math.max(last,i)});return last}
function monthPills(sel,fn){const last=lastMonth();
  return `<div class="pills" id="pills">${S.data.months.map((_,m)=>m<=last?`<button class="pill${m===sel?" active":""}" onclick="${fn}(${m})">${mon(m)}</button>`:"").join("")}</div>`}
/* keep the chosen month in view inside its own strip, without moving the page */
function keepPill(){document.querySelectorAll("#pills .active,.chart .active").forEach(p=>{const box=p.parentNode.classList.contains("chart")?p.parentNode.parentNode:p.parentNode;
  box.scrollLeft=p.offsetLeft-box.offsetLeft-(box.clientWidth-p.offsetWidth)/2})}
function ring(part,whole,label){const r=31,c=2*Math.PI*r,p=whole?Math.min(1,part/whole):0;
  return `<div class="ring"><svg viewBox="0 0 78 78"><circle class="rt" cx="39" cy="39" r="${r}"/><circle class="rv" cx="39" cy="39" r="${r}" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 39 39)"/></svg><div><b class="num">${n(part)}/${n(whole)}</b><small>${label}</small></div></div>`}
function donut(items,total){const r=50,c=2*Math.PI*r;let off=0;
  return `<svg class="donut" viewBox="0 0 128 128"><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="18"/>${items.map(it=>{const len=it.v/total*c,vis=Math.max(0,len-2.5);
    const s=`<circle cx="64" cy="64" r="${r}" fill="none" stroke="${esc(it.color)}" stroke-width="18" stroke-dasharray="${vis.toFixed(1)} ${(c-vis).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 64 64)"/>`;off+=len;return s}).join("")}</svg>`}

/* ---------------------------------------------------------------- home */
function homeView(){const D=S.data,f=me(),cm=curMonth(),mo=D.months[cm],c=monthCounts(cm);
  const due=dueTo(),owe=monthDue(f,cm);
  let done=0;for(let m=0;m<due;m++){const s=status(f,m);if(s==="paid"||s==="adj")done++}
  const st=owe>0
    ?`<div class="lbl">${t("thisDue",{m:monF(cm)})}</div><div class="big num" data-count="${owe}">${money(owe)}</div><div class="sub">${f.paid[cm]>0?t("partPaid",{a:money(f.paid[cm])}):dueLine()||t("rate")+": "+money(D.rate)}</div>`
    :`<div class="lbl">${t("thisDue",{m:monF(cm)})}</div><div class="big num">${money(0)}</div><div class="sub">${t("monthPaid")}</div>`;
  const showInstall=!STANDALONE&&!LS.get("noInstall",false);
  const top=D.notices[0];
  return `${showInstall?`<div class="banner info">${tile("phone","c6")}<span class="msg">${t("instBanner")}</span><button class="go" onclick="installSheet()">${t("instNow")}</button><button class="x" onclick="LS.set('noInstall',true);render()" aria-label="close">${ic("x")}</button></div>`:""}
  <div class="hero"><div class="hrow"><div><div class="who">${t("hello")} 🙏</div><b class="nm">${esc(f.name)}</b><span class="tag">${t("flat")} ${n(f.no)}</span></div>${ring(done,due,t("months"))}</div>${st}
    <div class="acts">${owe>0?`<button class="main" onclick="paySheet()">${ic("wallet")}${t("payNow")}</button>`:""}<button onclick="flatSheet(${D.flats.indexOf(f)})">${ic("receipt")}${t("details")}</button></div></div>
  <div class="qa"><button onclick="paySheet()">${tile("wallet")}${t("qPay")}</button><button onclick="receiptsSheet()">${tile("receipt","c5")}${t("qRcpt")}</button>
    <button onclick="complaintSheet()">${tile("pen","c2")}${t("qComp")}</button><button onclick="boardSheet()">${tile("list","c6")}${t("qBoard")}${openMine()?'<span class="dot"></span>':""}</button>
    <button onclick="go('not')">${tile("bell","c3")}${t("qNot")}${unseen()?'<span class="dot"></span>':""}</button><button onclick="contactsSheet()">${tile("call","c4")}${t("qDir")}</button>
    <button onclick="contactCommittee()">${tile("chat","c4")}${t("qCon")}</button><button onclick="shareApp()">${tile("share","c7")}${t("qShare")}</button></div>
  ${top?`<div class="card notice${top.pinned?" pin":""}"><h3>${tile("bell","c3","sm")}${t("latest")}<span class="sp"></span><button onclick="go('not')">${t("all")}${ic("next")}</button></h3>${noticeBody(top)}</div>`:""}
  <div class="card"><h3>${tile("cal","","sm")}${t("myYear",{y:n(D.year)})}</h3>${yearGrid(f)}</div>
  <div class="card"><h3>${tile("bank","c5","sm")}${t("society")}<span class="sp"></span><button onclick="go('acc')">${t("details")}${ic("next")}</button></h3>
    <div class="kp"><div class="k"><span>${t("bank")}</span><b class="num">${money(D.balance)}</b></div><div class="k bad"><span>${t("thisDue",{m:monF(cm)})}</span><b class="num">${money(monthDueAll(cm))}</b></div>
      <div class="k"><span>${ic("down")}${monF(cm)} · ${t("collected")}</span><b class="num">${money(mo.collected)}</b></div><div class="k"><span>${ic("up")}${monF(cm)} · ${t("expenses")}</span><b class="num">${money(mo.expenses)}</b></div></div>
    <div class="line small" style="margin-top:10px"><span style="font-weight:600">${monF(cm)}: ${t("paidCount",{a:n(c.paid),b:n(D.flats.length)})}</span><button class="link" onclick="go('mem')">${t("details")}${ic("next")}</button></div>
    <div class="prog"><i style="width:${Math.round(c.paid/D.flats.length*100)}%"></i></div></div>
  ${insightsCard()}`}
function insightsCard(){const it=(S.data.insights||{})[S.lang]||[];if(!it.length)return"";
  return `<div class="card"><h3>${tile("spark","c6","sm")}${t("insights")}</h3><div class="ins">${it.map(x=>`<div class="${esc(x.kind)}"><b>${esc(x.icon)}</b><span>${esc(x.text)}</span></div>`).join("")}</div></div>`}

/* ---------------------------------------------------------------- accounts */
function setAccMonth(m){const y=scrollY;S.accMonth=m;render();scrollTo(0,y)}
function accView(){const D=S.data,T2=D.totals,net=T2.collected-T2.expenses,sel=S.accMonth,mo=D.months[sel];
  const max=Math.max(1,...D.months.map(m=>Math.max(m.collected,m.expenses)));
  const cats=Object.entries(D.category_year).sort((a,b)=>b[1]-a[1]),ctot=cats.reduce((s,x)=>s+x[1],0)||1;
  const meta=k=>D.category_meta[k]||{};
  return `<div class="bal"><div class="lbl">${ic("bank")}${t("bank")}</div><div class="big num" data-count="${Math.round(D.balance)}">${money(D.balance)}</div>
    <div class="io"><div><span>${ic("down")}${t("ytdIn")}</span><b class="num">${money(T2.collected)}</b></div><div><span>${ic("up")}${t("ytdOut")}</span><b class="num">${money(T2.expenses)}</b></div></div>
    <div class="ft"><span>${net>=0?t("saving"):t("deficit")} (${n(D.year)})</span><b class="num${net>=0?"":" neg"}">${money(net,true)}</b></div>
    <div class="ft" style="margin-top:8px"><span>${t("thisDue",{m:monF(curMonth())})}</span><b class="num neg">${money(monthDueAll(curMonth()))}</b></div></div>
  <div class="card"><h3>${tile("chart","","sm")}${t("chart")}</h3>
    <div class="chartWrap"><div class="chart">${D.months.map((m,i)=>i>lastMonth()?"":`<button class="cm${i===sel?" active":""}" onclick="setAccMonth(${i})" aria-label="${monF(i)}"><span class="bars"><i class="c-in" style="height:${Math.round(m.collected/max*100)}%"></i><i class="c-out" style="height:${Math.round(m.expenses/max*100)}%"></i></span><small>${mon(i)}</small></button>`).join("")}</div></div>
    <div class="legend"><span><i class="c-in"></i>${t("collected")}</span><span><i class="c-out"></i>${t("expenses")}</span></div></div>
  <div class="card"><h3>${tile("receipt","c3","sm")}${t("expDetail")}</h3>${monthPills(sel,"setAccMonth")}
    <div class="chips" style="margin:10px 0 4px"><span class="chip info">${ic("down")}${money(mo.collected)}</span><span class="chip warn">${ic("up")}${money(mo.expenses)}</span><span class="chip ${mo.net>=0?"good":"bad"}">${mo.net>=0?t("saving"):t("deficit")} ${money(mo.net,true)}</span></div>
    ${mo.entries.length?`<div class="rows">${mo.entries.map(e=>{const col=meta(e.cat).color||"#6366f1";
      return `<div class="rw"><span class="ct" style="background:${esc(col)}22;color:${esc(col)}">${ic(CAT_IC[e.cat]||"box")}</span><span class="tx"><b>${esc(plain(e[S.lang]||e.en))}</b><small>${fmtDate(e.date)}</small></span><span class="am num">${money(e.amount)}</span></div>`}).join("")}
      <div class="rw"><span class="ct" style="background:var(--brandSoft);color:var(--brand);font-weight:800">Σ</span><span class="tx"><b>${t("total")} · ${monF(sel)}</b></span><span class="am num">${money(mo.expenses)}</span></div></div>`
      :`<div class="empty">${tile("receipt","c7")}${t("noExp")}</div>`}</div>
  <div class="card"><h3>${tile("pie","c6","sm")}${t("cats")}</h3>
    <div class="dn">${donut(cats.map(([k,v])=>({v,color:meta(k).color||"#6366f1"})),ctot)}<div class="mid"><span>${t("ytdOut")}</span><b class="num">${money(T2.expenses)}</b></div></div>
    ${cats.map(([k,v])=>{const c=meta(k);
    return `<div class="cat"><span><i style="background:${esc(c.color||"#6366f1")}"></i>${esc(S.lang==="mr"?c.mr:c.en)}</span><b class="num">${money(v)} <span class="muted small">${n(Math.round(v/ctot*100))}%</span></b><div class="track"><i style="width:${Math.round(v/ctot*100)}%;background:${esc(c.color||"#6366f1")}"></i></div></div>`}).join("")}</div>`}
/* expense names arrive as "emoji name"; the app draws its own icon */
function plain(s){const i=s.indexOf(" ");return i>0&&i<=8?s.slice(i+1):s}

/* ---------------------------------------------------------------- members */
function setMemMonth(m){const y=scrollY;S.memMonth=m;render();scrollTo(0,y)}
function memView(){const D=S.data,m=S.memMonth,c=monthCounts(m),mine=String(S.flat);
  const rank={due:0,partial:1,adj:2,paid:2,none:3,future:3},now=m===curMonth();
  const list=D.flats.map((f,i)=>({f,i,s:status(f,m)})).sort((a,b)=>rank[a.s]-rank[b.s]||a.i-b.i);
  const chip=x=>x.s==="paid"?`<span class="chip good">${ic("check")}${money(x.f.paid[m])}</span>`:x.s==="adj"?`<span class="chip good">${ic("check")}${t("adj")}</span>`:
    x.s==="partial"?`<span class="chip warn">${money(x.f.paid[m])}</span>`:x.s==="due"?`<span class="chip bad">${t("due")}</span>`:`<span class="chip info">—</span>`;
  return `<div class="card"><h3>${tile("cal","","sm")}${monF(m)} ${n(D.year)}</h3>${monthPills(m,"setMemMonth")}
    <div class="chips" style="margin-top:10px"><span class="chip good">${ic("check")}${t("paid")} ${n(c.paid)}</span>${c.partial?`<span class="chip warn">${t("partial")} ${n(c.partial)}</span>`:""}${now?`<span class="chip bad">${t("pending")} ${n(c.due)}</span>`:""}</div>
    <div class="prog"><i style="width:${Math.round(c.paid/D.flats.length*100)}%"></i></div></div>
  <div class="card"><div class="rows">${list.map(x=>`<button class="rw${String(x.f.no)===mine?" me":""}" onclick="flatSheet(${x.i})">${avatar(x.f,x.i)}
    <span class="tx"><b>${esc(x.f.name)}${String(x.f.no)===mine?` <span class="chip info">${t("you")}</span>`:""}</b><small>${t("flat")} ${n(x.f.no)}${monthDue(x.f,m)>0?" · "+t("due")+" "+money(monthDue(x.f,m)):""}</small></span>
    <span class="am">${chip(x)}</span></button>`).join("")}</div></div>`}
function flatSheet(i){const D=S.data,f=D.flats[i],cm=curMonth(),owe=monthDue(f,cm);
  sheet(`<div class="sh">${avatar(f,i)}<div><h2>${esc(f.name)}</h2><p>${t("flat")} ${n(f.no)} · ${t("rate")} ${money(D.rate)}</p></div></div>
    <div class="kp" style="margin:16px 0 14px"><div class="k"><span>${t("totalPaid")}</span><b class="num">${money(f.total)}</b></div>
      <div class="k ${owe>0?"bad":"good"}"><span>${t("thisDue",{m:monF(cm)})}</span><b class="num">${money(owe)}</b></div></div>
    ${yearGrid(f)}
    ${String(f.no)===String(S.flat)&&owe>0?`<div style="height:6px"></div><button class="btn primary" onclick="paySheet()">${ic("wallet")}${t("payNow")}</button>`:""}`)}

/* ---------------------------------------------------------------- notices */
function notView(){const N=S.data.notices;return N.length?N.map(noticeCard).join(""):`<div class="card empty">${tile("bell","c3")}${t("noNotices")}</div>`}

/* ---------------------------------------------------------------- more */
function moreView(){const f=me(),dark=document.documentElement.getAttribute("data-theme")==="dark";
  const item=(icn,c,title,sub,fn)=>`<button class="rw" onclick="${fn}">${tile(icn,c)}<span class="tx"><b>${title}</b>${sub?`<small>${sub}</small>`:""}</span><span class="go">${ic("next")}</span></button>`;
  return `<div class="card"><div class="rows">
    ${item("wallet","",t("payMaint"),t(S.data.contact.pay_url?"payMaintO":"payMaintS"),"paySheet()")}
    ${item("receipt","c5",t("receipts"),t("receiptsS"),"receiptsSheet()")}
    ${item("pen","c2",t("complaint"),t("complaintS"),"complaintSheet()")}
    ${item("list","c6",t("board"),t("boardS"),"boardSheet()")}
    ${item("call","c4",t("contacts"),t("contactsS"),"contactsSheet()")}
    ${item("chat","c4",t("contact"),t("contactS"),"contactCommittee()")}</div></div>

    document.addEventListener("visibilitychange",vis);addEventListener("blur",blur);addEventListener("focus",focus);

/* ---------------------------------------------------------------- QR code (byte mode, error correction M) */
const QR_ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
const QR_BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
function qrRaw(v){let r=(16*v+128)*v+64;if(v>=2){const a=Math.floor(v/7)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36}return r}
function qrCap(v){return Math.floor(qrRaw(v)/8)-QR_ECC[v]*QR_BLK[v]}
function gfMul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z}
function rsDivisor(deg){const r=new Array(deg).fill(0);r[deg-1]=1;let root=1;
  for(let i=0;i<deg;i++){for(let j=0;j<deg;j++){r[j]=gfMul(r[j],root);if(j+1<deg)r[j]^=r[j+1]}root=gfMul(root,2)}return r}
function rsRemainder(data,div){const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=gfMul(c,f)})}return r}
function qrPenalty(M){const n=M.length;let res=0;
  const add=(run,h)=>{if(h[0]===0)run+=n;h.pop();h.unshift(run)};
  const count=h=>{const k=h[1],core=k>0&&h[2]===k&&h[3]===k*3&&h[4]===k&&h[5]===k;return (core&&h[0]>=k*4&&h[6]>=k?1:0)+(core&&h[6]>=k*4&&h[0]>=k?1:0)};
  const line=get=>{let color=false,run=0;const h=[0,0,0,0,0,0,0];
    for(let i=0;i<n;i++){const c=get(i);if(c===color){run++;if(run===5)res+=3;else if(run>5)res++}else{add(run,h);if(!color)res+=count(h)*40;color=c;run=1}}
    if(color){add(run,h);run=0}run+=n;add(run,h);res+=count(h)*40};
  for(let y=0;y<n;y++)line(x=>M[y][x]);
  for(let x=0;x<n;x++)line(y=>M[y][x]);
  for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])res+=3}
  let dark=0;M.forEach(r=>r.forEach(c=>{if(c)dark++}));const total=n*n;
  return res+(Math.ceil(Math.abs(dark*20-total*10)/total)-1)*10}
/* returns {version, mask, modules[y][x]} or null when the text is too long */
function qrCode(text){
  const bytes=[...new TextEncoder().encode(text)];let v=1;
  for(;;v++){if(v>40)return null;if(4+(v<10?8:16)+bytes.length*8<=qrCap(v)*8)break}
  const cap=qrCap(v)*8,bits=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
  put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
  put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
  for(let pad=0xEC;bits.length<cap;pad^=0xEC^0x11)put(pad,8);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
  const nb=QR_BLK[v],el=QR_ECC[v],raw=Math.floor(qrRaw(v)/8),short=nb-raw%nb,sl=Math.floor(raw/nb),div=rsDivisor(el),blocks=[];
  for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+sl-el+(i<short?0:1));k+=d.length;const e=rsRemainder(d,div);if(i<short)d.push(0);blocks.push(d.concat(e))}
  const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-el||j>=short)all.push(b[i])});
  const n=v*4+17,M=Array.from({length:n},()=>new Array(n).fill(false)),F=Array.from({length:n},()=>new Array(n).fill(false));
  const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
  for(let i=0;i<n;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<n&&y>=0&&y<n)set(x,y,d!==2&&d!==4)}};
  finder(3,3);finder(n-4,3);finder(3,n-4);
  const pos=[];if(v>1){const na=Math.floor(v/7)+2,step=v===32?26:Math.ceil((v*4+4)/(na*2-2))*2;for(let p=n-7;pos.length<na-1;p-=step)pos.unshift(p);pos.unshift(6)}
  const last=pos.length-1;
  pos.forEach((x,i)=>pos.forEach((y,j)=>{if((i===0&&j===0)||(i===0&&j===last)||(i===last&&j===0))return;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(x+dx,y+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}));
  const format=mask=>{let rem=mask;for(let i=0;i<10;i++)rem=(rem<<1)^((rem>>>9)*0x537);const b=((mask<<10)|rem)^0x5412,bit=i=>((b>>>i)&1)!==0;
    for(let i=0;i<=5;i++)set(8,i,bit(i));set(8,7,bit(6));set(8,8,bit(7));set(7,8,bit(8));for(let i=9;i<15;i++)set(14-i,8,bit(i));
    for(let i=0;i<8;i++)set(n-1-i,8,bit(i));for(let i=8;i<15;i++)set(8,n-15+i,bit(i));set(8,n-8,true)};
  format(0);
  if(v>=7){let rem=v;for(let i=0;i<12;i++)rem=(rem<<1)^((rem>>>11)*0x1F25);const b=(v<<12)|rem;
    for(let i=0;i<18;i++){const d=((b>>>i)&1)!==0,a=n-11+i%3,c=Math.floor(i/3);set(a,c,d);set(c,a,d)}}
  let k=0;for(let right=n-1;right>=1;right-=2){if(right===6)right=5;
    for(let vert=0;vert<n;vert++)for(let j=0;j<2;j++){const x=right-j,y=((right+1)&2)===0?n-1-vert:vert;
      if(!F[y][x]&&k<all.length*8){M[y][x]=((all[k>>>3]>>>(7-(k&7)))&1)!==0;k++}}}
  const MASK=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
    (x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const flip=m=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!F[y][x]&&MASK[m](x,y))M[y][x]=!M[y][x]};
  let best=0,min=Infinity;for(let m=0;m<8;m++){flip(m);format(m);const p=qrPenalty(M);if(p<min){min=p;best=m}flip(m)}
  flip(best);format(best);return {version:v,mask:best,modules:M}}

/* ---------------------------------------------------------------- payment notifications */
/* The last payments this phone has seen are kept where the service worker can read them too.
   A month whose amount went up since then is a newly recorded payment: the member is told in
   the app, and with a phone notification when that is switched on. On Android an installed app
   also looks in the background now and then (sw.js). */
const NOTE_OK="Notification" in window&&"serviceWorker" in navigator&&"caches" in window;
function notifyOn(){return NOTE_OK&&LS.get("notify",false)&&Notification.permission==="granted"}
async function payState(v){try{const c=await caches.open("society-state");
  if(v===undefined){const r=await c.match("pay-state");return r?await r.json():null}
  await c.put("pay-state",new Response(JSON.stringify(v)))}catch(e){}return null}
function phoneNote(title,body){navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:"icon-192.png",badge:"icon-192.png",tag:"pay",data:{url:location.href}})).catch(()=>{})}
async function checkPayments(){const f=me();if(!f||!("caches" in window))return;
  const old=await payState(),same=old&&String(old.flat)===String(S.flat)&&old.year===S.data.year;
  const got=same?f.paid.map((v,m)=>({m,a:v-(old.paid[m]||0)})).filter(x=>x.a>0):[];
  await payState({flat:S.flat,year:S.data.year,paid:f.paid,pass:S.pass,lang:S.lang,on:notifyOn(),title:t("payGot"),body:t("payGotB"),mons:MON[S.lang+"F"]});
  if(!got.length)return;
  const lines=got.map(x=>t("payGotB",{m:monF(x.m),a:money(x.a)}));
  lines.forEach(toast);
  if(notifyOn())phoneNote(t("payGot"),lines.join("\n"))}
function bgCheck(on){if(!NOTE_OK)return;
  navigator.serviceWorker.ready.then(r=>r.periodicSync&&(on?r.periodicSync.register("pay-check",{minInterval:6*3600*1000}):r.periodicSync.unregister("pay-check"))).catch(()=>{})}
async function toggleNotify(){
  if(notifyOn()){LS.set("notify",false);bgCheck(false);await checkPayments();render();return toast(t("notifStop"))}
  const p=Notification.permission==="default"?await Notification.requestPermission():Notification.permission;
  if(p!=="granted")return toast(t("notifBlocked"));
  LS.set("notify",true);bgCheck(true);await checkPayments();render();phoneNote(bname(),t("notifReady"))}

/* ---------------------------------------------------------------- install */
addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.installEvt=e});
addEventListener("appinstalled",()=>{S.installEvt=null;LS.set("noInstall",true)});
function installSheet(){
  if(S.installEvt){S.installEvt.prompt();S.installEvt.userChoice.then(()=>{S.installEvt=null}).catch(()=>{});return}
  sheet(`${sheetHead("phone","c6",t("install"),t("installS"))}<ol class="steps">${t(IOS?"instI":"instA").map(s=>`<li><span>${s}</span></li>`).join("")}</ol>`)}

/* ---------------------------------------------------------------- bottom sheet */
function sheet(html){$("sheet").innerHTML='<div class="grab"></div>'+html;$("sheet").scrollTop=0;$("ov").classList.add("show")}
function closeSheet(){$("ov").classList.remove("show")}
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------------------------------------------------------------- start */
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.data&&Date.now()-S.loadedAt>5*60*1000)loadData()});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(()=>{if(notifyOn())bgCheck(true)}).catch(()=>{}));
readLink();
loadData();
</script>
</body>
